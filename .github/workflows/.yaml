name: Terraform CI-CD

on:
  push:
    branches:
      - "feature/**"
      - main

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: "./env/prod"

jobs:

  # ============================
  # FEATURE BRANCH - PLAN
  # ============================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    if: github.ref != 'refs/heads/main'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

    
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: |
            {
              
              client-id: ${{ secrets.CLIENTID }}
              client-secret: ${{ secrets.CLIENTSECRET }}
              tenant-id: ${{ secrets.TENANTID }}
              subscription-id: ${{ secrets.SUBSCRIPTIONID }}
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan


  # ============================
  # MAIN BRANCH - PLAN + APPROVAL + APPLY
  # ============================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

       - name: Azure Login
        uses: azure/login@v3
        with:
          creds: |
            {

              client-id: ${{ secrets.CLIENTID }}
              client-secret: ${{ secrets.CLIENTSECRET }}
              tenant-id: ${{ secrets.TENANTID }}
              subscription-id: ${{ secrets.SUBSCRIPTIONID }}
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve